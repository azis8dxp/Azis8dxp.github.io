<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZIZ - Agent de sécurité</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #191c20;
    }

    /* CARTE PRINCIPALE */
    .card {
      width: 100%;
      max-width: 430px;
      padding: 40px 25px;
      border-radius: 28px;
      background-color: #ffffff;
      
      /* Ton image de marbre */
      background-image: url('marbre.jpg.jpg');
      background-size: cover;
      background-position: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    /* LOGO SÉCURITÉ METALLIQUE (BOUCLIER + CADENAS) */
    .logo-securite {
      width: 85px;
      height: 102px;
      margin: 0 auto 18px;
      display: block;
      filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.35));
    }

    /* TEXTES */
    h1 {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #111111;
      margin-bottom: 2px;
    }

    .subtitle {
      font-size: 18px;
      color: #444444;
      font-weight: 500;
      margin-bottom: 28px;
    }

    /* BOUTONS */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .btn {
      width: 100%;
      padding: 15px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-cv {
      color: #ffffff;
      background: linear-gradient(180deg, #42474c 0%, #222528 100%);
      border: 1px solid #111;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .btn-contact {
      color: #111111;
      background: #ffffff;
      border: 2px solid #333333;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* BADGES SUR UNE SEULE LIGNE */
    .tags {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: nowrap;
      gap: 6px;
    }

    .tag {
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(0, 0, 0, 0.08);
      font-size: 13px;
      font-weight: 600;
      color: #222222;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- Logo vectoriel bouclier + cadenas identique à ta photo -->
    <div class="logo-securite">
  <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#5a626a" />
        <stop offset="50%" stop-color="#32373d" />
        <stop offset="100%" stop-color="#1d2024" />
      </linearGradient>
    </defs>
    
    <!-- Bouclier Externe avec la pointe haut aiguisée en V -->
    <path d="M 50 10 L 88 32 V 68 C 88 95, 50 114, 50 114 C 50 114, 12 95, 12 68 V 32 Z" 
          fill="none" stroke="url(#metalGrad)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Bouclier Interne -->
    <path d="M 50 22 L 78 40 V 66 C 78 87, 50 102, 50 102 C 50 102, 22 87, 22 66 V 40 Z" 
          fill="none" stroke="url(#metalGrad)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Corps du Cadenas -->
    <rect x="38" y="60" width="24" height="20" rx="4" 
          fill="none" stroke="url(#metalGrad)" stroke-width="4"/>
    
    <!-- Anse du Cadenas -->
    <path d="M 43 60 V 51 C 43 45, 57 45, 57 51 V 60" 
          fill="none" stroke="url(#metalGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Coche (validé) -->
    <path d="M 44 70 L 49 74 L 56 65" 
          fill="none" stroke="url(#metalGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>
        <!-- Dégradé métallique sombre -->
        <defs>
          <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5a626a" />
            <stop offset="50%" stop-color="#32373d" />
            <stop offset="100%" stop-color="#1d2024" />
          </linearGradient>
        </defs>
        
        <!-- Bouclier Externe -->
        <path d="M 50 6 C 72 16, 88 18, 90 28 C 90 68, 70 98, 50 114 C 30 98, 10 68, 10 28 C 12 18, 28 16, 50 6 Z" 
              fill="none" stroke="url(#metalGrad)" stroke-width="5" stroke-linejoin="round"/>
        
        <!-- Bouclier Interne -->
        <path d="M 50 16 C 68 24, 80 26, 82 34 C 82 66, 65 90, 50 103 C 35 90, 18 66, 18 34 C 20 26, 32 24, 50 16 Z" 
              fill="none" stroke="url(#metalGrad)" stroke-width="4.5" stroke-linejoin="round"/>
        
        <!-- Corps Cadenas -->
        <rect x="37" y="58" width="26" height="22" rx="4" 
              fill="none" stroke="url(#metalGrad)" stroke-width="4.5"/>
        
        <!-- Anse Cadenas -->
        <path d="M 43 58 V 50 C 43 43, 57 43, 57 50 V 58" 
              fill="none" stroke="url(#metalGrad)" stroke-width="4.5" stroke-linecap="round"/>
        
        <!-- Coche Validé -->
        <path d="M 44 69 L 48 73 L 56 64" 
              fill="none" stroke="url(#metalGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>AZIZ CRABS</h1>
    <p class="subtitle"></p>

    <div class="buttons">
      <a href="#" class="btn btn-cv">
        Voir mon CV 📄
      </a>
      <a href="#" class="btn btn-contact">
        Me contacter ✉️
      </a>
    </div>

    <div class="tags">
      <span class="tag">Sérieux</span>
      <span class="tag">Ponctuel</span>
      <span class="tag">Motivé</span>
      <span class="tag">Discret</span>
    </div>
  </div>

</body>
</html>

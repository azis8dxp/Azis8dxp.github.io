<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZIZ - Agent de sécurité</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
min-height: 100vh;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
background: radial-gradient(circle at 50% 30%, #3a4048 0%, #181b1e 100%);
color: #1a1a1a;
}

/* CARTE PRINCIPALE EN MARBRE BLANC */
.card {
width: 100%;
max-width: 440px;
padding: 45px 30px;
border-radius: 32px;
/* Image de vrai marbre blanc fiable */
background-color: #f5f5f7;
background-image: url('https://raw.githubusercontent.com/azis8dxp/azis8dxp.github.io/main/marbre.jpg'),
url('https://images.unsplash.com/photo-1590381105924-c72589b9ef3f?auto=format&fit=crop&w=800&q=80'),
linear-gradient(135deg, #fdfdfd 0%, #e2e2e2 100%);
background-size: cover;
background-position: center;
box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
text-align: center;
}

/* AVATAR "A" METALLIQUE 3D */
.avatar {
width: 95px;
height: 95px;
margin: 0 auto 20px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 45px;
font-weight: 300;
color: #ffffff;
background: radial-gradient(circle at 35% 35%, #88929a 0%, #3e444b 70%, #25292e 100%);
box-shadow: inset 0 3px 5px rgba(255, 255, 255, 0.6),
inset 0 -5px 10px rgba(0, 0, 0, 0.7),
0 8px 18px rgba(0, 0, 0, 0.25);
border: 2px solid #6b737b;
}

/* TEXTES */
h1 {
font-size: 38px;
font-weight: 800;
letter-spacing: 2.5px;
color: #1c1c1e;
margin-bottom: 4px;
}

.subtitle {
font-size: 19px;
color: #55555e;
font-weight: 500;
margin-bottom: 35px;
}

/* CONTENEUR BOUTONS */
.buttons {
display: flex;
flex-direction: column;
gap: 16px;
margin-bottom: 35px;
}

.btn {
width: 100%;
padding: 18px 20px;
border-radius: 18px;
text-decoration: none;
font-size: 19px;
font-weight: 700;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
transition: transform 0.15s ease;
}

.btn:active {
transform: scale(0.98);
}

/* BOUTON VOIR MON CV (SOMBRE TEXTURÉ) */
.btn-cv {
color: #ffffff;
background: linear-gradient(180deg, #484d52 0%, #292c30 100%);
border: 1px solid #1a1a1a;
box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.25);
}

/* BOUTON ME CONTACTER (BLANC) */
.btn-contact {
color: #1c1c1e;
background: linear-gradient(180deg, #ffffff 0%, #f4f4f6 100%);
border: 2px solid #3a3a3c;
box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}

/* BADGES EN BAS */
.tags {
display: flex;
justify-content: center;
flex-wrap: wrap;
gap: 10px;
}

.tag {
padding: 8px 16px;
border-radius: 12px;
background: rgba(235, 235, 240, 0.75);
border: 1px solid rgba(0, 0, 0, 0.06);
font-size: 15px;
font-weight: 600;
color: #2c2c2e;
}
</style>
</head>
<body>

<div class="card">
<div class="avatar">A</div>

<h1>AZIZ</h1>
<p class="subtitle">Agent de sécurité</p>

<div class="buttons">
<a href="#" class="btn btn-cv">
Voir mon CV 📄
</a>
<a href="#" class="btn btn-contact">
Me contacter ✉️
</a>
</div>

<div class="tags">
<span class="tag">Sérieux</span>
<span class="tag">Ponctuel</span>
<span class="tag">Motivé</span>
<span class="tag">Discret</span>
</div>
</div>

</body>
</html>

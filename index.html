<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aziz - Agent APS / SSIAP 1</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #545454;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 50px 30px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #545454;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #545454;
        }

        .job {
            font-size: 17px;
            color: #777;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .button {
            display: block;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        .cv {
            background: #545454;
            color: white;
        }

        .contact {
            border: 2px solid #545454;
            color: #545454;
            background: white;
        }

        .button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">A</div>

        <h1>AZIZ</h1>

        <p class="job">Agent APS / SSIAP 1</p>

        <div class="buttons">

            <a href="CV.pdf" target="_blank" class="button cv">
                Voir mon CV
            </a>

            <a href="tel:0612345678" class="button contact">
                Me contacter
            </a>

        </div>

        <p class="footer">
            Sérieux • Ponctuel • Motivé • Discret
        </p>

    </div>

</body>
</html>

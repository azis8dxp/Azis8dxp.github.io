<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZIZ CRABS - Agent APS / SSIAP 1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* FIX POUR CENTRER PARFAITEMENT SUR MOBILE */
    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh; /* S'adapte parfaitement aux écrans de téléphone */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      background: #191c20;
    }

    /* CARTE PRINCIPALE */
    .card {
      width: 100%;
      max-width: 430px;
      padding: 35px 20px;
      border-radius: 28px;
      background-color: #ffffff;
      background-image: url('marbre.jpg');
      background-size: cover;
      background-position: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    /* AVATAR / LOGO */
    .avatar {
      width: 85px;
      height: 85px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #ffffff;
      background: radial-gradient(circle at 35% 35%, #7e878f 0%, #32373d 100%);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), 
                  inset 0 -4px 8px rgba(0, 0, 0, 0.7),
                  0 6px 14px rgba(0, 0, 0, 0.25);
      border: 2px solid #5c636a;
    }

    /* Si tu mets une photo à la place, décommente la ligne sous la classe img : */
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* TEXTES */
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #111111;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 17px;
      color: #444444;
      font-weight: 600;
      margin-bottom: 25px;
    }

    /* BOUTONS */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .btn {
      width: 100%;
      padding: 15px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-cv {
      color: #ffffff;
      background: linear-gradient(180deg, #42474c 0%, #222528 100%);
      border: 1px solid #111;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .btn-contact {
      color: #111111;
      background: #ffffff;
      border: 2px solid #333333;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* BADGES SUR UNE SEULE LIGNE */
    .tags {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: nowrap;
      gap: 5px;
    }

    .tag {
      padding: 6px 9px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0, 0, 0, 0.08);
      font-size: 13px;
      font-weight: 600;
      color: #222222;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Remplace 🛡️ par AC si tu veux tes initiales ou par <img src="ma-photo.jpg"> si tu as une photo -->
    <div class="avatar">🛡️</div>

    <h1>AZIZ CRABS</h1>
    <p class="subtitle">Agent APS / SSIAP 1</p>

    <div class="buttons">
      <a href="#" class="btn btn-cv">
        Voir mon CV 📄
      </a>
      <a href="#" class="btn btn-contact">
        Me contacter ✉️
      </a>
    </div>

    <div class="tags">
      <span class="tag">Sérieux</span>
      <span class="tag">Ponctuel</span>
      <span class="tag">Motivé</span>
      <span class="tag">Discret</span>
    </div>
  </div>

</body>
</html>

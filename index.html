<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZIZ - Agent de sécurité</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
min-height: 100vh;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
/* Fond sombre dégradé derrière la carte */
background: radial-gradient(circle at 20% 10%, #303841 0%, #191d21 100%);
color: #1a1a1a;
}

/* CARTE PRINCIPALE EN MARBRE */
.card {
width: 100%;
max-width: 480px;
padding: 40px 30px;
border-radius: 28px;
/* Fond Marbre Blanc ultra propre */
background-image: url('https://images.unsplash.com/photo-1590381105924-c72589b9ef3f?q=80&w=1000&auto=format&fit=crop');
background-size: cover;
background-position: center;
box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
text-align: center;
}

/* AVATAR "A" METALLIQUE 3D */
.avatar {
width: 100px;
height: 100px;
margin: 0 auto 20px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 48px;
font-weight: 300;
color: #ffffff;
background: linear-gradient(135deg, #7e888f 0%, #383e45 100%);
box-shadow: inset 0 3px 6px rgba(255, 255, 255, 0.5),
inset 0 -6px 12px rgba(0, 0, 0, 0.6),
0 8px 15px rgba(0, 0, 0, 0.3);
border: 2px solid #5a626a;
}

/* TEXTES */
h1 {
font-size: 42px;
font-weight: 800;
letter-spacing: 2px;
color: #111111;
margin-bottom: 6px;
}

.subtitle {
font-size: 20px;
color: #555555;
font-weight: 500;
margin-bottom: 35px;
}

/* CONTENEUR BOUTONS */
.buttons {
display: flex;
flex-direction: column;
gap: 16px;
margin-bottom: 35px;
}

.btn {
width: 100%;
padding: 18px 20px;
border-radius: 16px;
text-decoration: none;
font-size: 20px;
font-weight: 700;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
transition: transform 0.2s, box-shadow 0.2s;
}

.btn:active {
transform: scale(0.98);
}

/* BOUTON VOIR MON CV (SOMBRE MAT/TEXTURÉ) */
.btn-cv {
color: #ffffff;
background: linear-gradient(145deg, #43484d 0%, #222528 100%);
border: 1px solid #111;
box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

/* BOUTON ME CONTACTER (BLANC/GRIS CLAIR) */
.btn-contact {
color: #111111;
background: linear-gradient(180deg, #ffffff 0%, #f0f0f0 100%);
border: 2px solid #333333;
box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

/* BADGES EN BAS */
.tags {
display: flex;
justify-content: center;
flex-wrap: wrap;
gap: 10px;
}

.tag {
padding: 8px 16px;
border-radius: 10px;
background: rgba(255, 255, 255, 0.65);
backdrop-filter: blur(4px);
border: 1px solid rgba(0, 0, 0, 0.08);
font-size: 15px;
font-weight: 600;
color: #333333;
box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
}
</style>
</head>
<body>

<div class="card">
<!-- LOGO A -->
<div class="avatar">A</div>

<!-- NOM ET TITRE -->
<h1>AZIZ</h1>
<p class="subtitle">Agent de sécurité</p>

<!-- BOUTONS D'ACTION -->
<div class="buttons">
<a href="#" class="btn btn-cv">
Voir mon CV 📄
</a>
<a href="#" class="btn btn-contact">
Me contacter ✉️
</a>
</div>

<!-- BADGES EN BAS -->
<div class="tags">
<span class="tag">Sérieux</span>
<span class="tag">Ponctuel</span>
<span class="tag">Motivé</span>
<span class="tag">Discret</span>
</div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aziz - Agent de sécurité</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 50px 20px;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            background:
                radial-gradient(circle at top, #39414b 0%, #252b31 55%, #1d2227 100%);

            color: #303030;
        }

        /* CARTE PRINCIPALE */
        .card {
            width: 100%;
            max-width: 520px;

            padding: 70px 55px 65px;

            border-radius: 32px;

            /* Texture marbre */
            background-image:
                url("https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1200&q=85");

            background-size: cover;
            background-position: center;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.30),
                inset 0 0 0 1px rgba(255, 255, 255, 0.8);

            text-align: center;
        }

        /* AVATAR */
        .avatar {
            width: 125px;
            height: 125px;

            margin: 0 auto 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 64px;
            font-weight: 300;
            color: white;

            background:
                radial-gradient(
                    circle at 35% 25%,
                    #f1f1f1 0%,
                    #aeb4b8 12%,
                    #737a7f 32%,
                    #343a3f 68%,
                    #15191c 100%
                );

            border: 3px solid #aeb3b6;

            box-shadow:
                inset 0 3px 8px rgba(255,255,255,0.65),
                inset 0 -8px 15px rgba(0,0,0,0.45),
                0 10px 22px rgba(0,0,0,0.30);

            text-shadow:
                0 2px 3px rgba(0,0,0,0.45);
        }

        /* NOM */
        h1 {
            font-size: 58px;
            font-weight: 800;
            letter-spacing: 2px;

            margin-bottom: 12px;

            color: #303030;
        }

        /* MÉTIER */
        .job {
            font-size: 27px;
            font-weight: 400;

            color: #686868;

            margin-bottom: 75px;
        }

        /* BOUTONS */
        .button {
            width: 100%;
            min-height: 82px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;

            text-decoration: none;

            font-size: 25px;
            font-weight: 700;

            border-radius: 18px;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .button:active {
            transform: scale(0.98);
        }

        /* BOUTON CV */
        .cv-button {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #686868 0%,
                    #4b4b4b 45%,
                    #303030 100%
                );

            border: 2px solid #292929;

            box-shadow:
                inset 0 1px 2px rgba(255,255,255,0.25),
                inset 0 -2px 5px rgba(0,0,0,0.35),
                0 8px 15px rgba(0,0,0,0.20);

            margin-bottom: 22px;
        }

        /* PETITE ICÔNE CV */
        .cv-icon {
            font-size: 32px;
            line-height: 1;
        }

        /* BOUTON CONTACT */
        .contact-button {
            color: #303030;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #eeeeee 100%
                );

            border: 3px solid #5b5b5b;

            box-shadow:
                0 7px 15px rgba(0,0,0,0.12);

            margin-bottom: 55px;
        }

        /* ICÔNE CONTACT */
        .contact-icon {
            font-size: 28px;
        }

        /* BADGES */
        .badges {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .badge {
            padding: 10px 16px;

            border-radius: 13px;

            background: rgba(225, 228, 232, 0.85);

            color: #303030;

            font-size: 17px;
            font-weight: 400;

            box-shadow:
                0 4px 10px rgba(0,0,0,0.08);

            backdrop-filter: blur(4px);
        }

        /* VERSION TÉLÉPHONE */
        @media (max-width: 600px) {

            body {
                padding: 35px 20px;
            }

            .card {
                max-width: 100%;

                padding: 70px 50px 65px;

                border-radius: 30px;
            }

            .avatar {
                width: 120px;
                height: 120px;

                margin-bottom: 50px;

                font-size: 60px;
            }

            h1 {
                font-size: 48px;
            }

            .job {
                font-size: 25px;
                margin-bottom: 70px;
            }

            .button {
                min-height: 78px;
                font-size: 23px;
            }

            .badge {
                font-size: 16px;
                padding: 9px 14px;
            }
        }

        /* PETITS TÉLÉPHONES */
        @media (max-width: 400px) {

            body {
                padding: 25px 15px;
            }

            .card {
                padding: 55px 25px 50px;
            }

            .avatar {
                width: 110px;
                height: 110px;

                font-size: 55px;

                margin-bottom: 40px;
            }

            h1 {
                font-size: 42px;
            }

            .job {
                font-size: 22px;
                margin-bottom: 55px;
            }

            .button {
                min-height: 72px;
                font-size: 21px;
            }

            .badges {
                gap: 8px;
            }

            .badge {
                font-size: 15px;
                padding: 8px 11px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <!-- AVATAR -->
        <div class="avatar">
            A
        </div>

        <!-- NOM -->
        <h1>AZIZ</h1>

        <!-- MÉTIER -->
        <p class="job">Agent de sécurité</p>

        <!-- BOUTON CV -->
        <a
            href="CV.pdf"
            target="_blank"
            class="button cv-button"
        >
            <span>Voir mon CV</span>
            <span class="cv-icon">▤</span>
        </a>

        <!-- BOUTON CONTACT -->
        <a
            href="tel:0612345678"
            class="button contact-button"
        >
            <span>Me contacter</span>
            <span class="contact-icon">✉</span>
        </a>

        <!-- BADGES -->
        <div class="badges">

            <span class="badge">Sérieux</span>
            <span class="badge">Ponctuel</span>
            <span class="badge">Motivé</span>
            <span class="badge">Discret</span>

        </div>

    </main>

</body>
</html>

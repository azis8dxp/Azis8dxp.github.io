<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aziz - Agent de sécurité</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at 20% 10%, #46505b 0%, transparent 35%),
        radial-gradient(circle at 80% 90%, #171b20 0%, transparent 40%),
        linear-gradient(135deg, #303943, #171b20);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 35px 20px;
}

/* CARTE PRINCIPALE */

.card {
    width: 100%;
    max-width: 560px;

    padding: 70px 55px 55px;

    border-radius: 28px;

    background-color: #f8f8f8;

    /* effet marbre */
    background-image:
        radial-gradient(
            ellipse at 20% 30%,
            rgba(180,180,180,0.12) 0%,
            transparent 35%
        ),
        radial-gradient(
            ellipse at 80% 65%,
            rgba(150,150,150,0.10) 0%,
            transparent 35%
        ),
        linear-gradient(
            120deg,
            transparent 35%,
            rgba(170,170,170,0.08) 38%,
            transparent 42%,
            rgba(170,170,170,0.06) 65%,
            transparent 70%
        ),
        linear-gradient(
            60deg,
            transparent 45%,
            rgba(190,190,190,0.08) 48%,
            transparent 52%
        );

    box-shadow:
        0 25px 60px rgba(0,0,0,0.35),
        inset 0 0 40px rgba(255,255,255,0.7);

    text-align: center;
}

/* LOGO */

.logo {
    width: 130px;
    height: 130px;

    margin: 0 auto 65px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 70px;
    font-weight: 300;

    color: white;

    background:
        radial-gradient(
            circle at 35% 25%,
            #aeb4b8 0%,
            #687077 20%,
            #343b41 55%,
            #11161b 100%
        );

    border: 3px solid #9da3a7;

    box-shadow:
        inset 0 3px 8px rgba(255,255,255,0.65),
        inset 0 -8px 15px rgba(0,0,0,0.5),
        0 10px 18px rgba(0,0,0,0.28);
}

/* NOM */

h1 {
    font-size: 58px;
    font-weight: 800;
    letter-spacing: 1px;

    color: #303030;

    margin-bottom: 18px;
}

/* METIER */

.subtitle {
    font-size: 29px;
    font-weight: 400;

    color: #6b6b6b;

    margin-bottom: 70px;
}

/* BOUTONS */

.buttons {
    display: flex;
    flex-direction: column;
    gap: 28px;
}

.btn {
    width: 100%;

    min-height: 100px;

    border-radius: 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 16px;

    text-decoration: none;

    font-size: 30px;
    font-weight: 700;

    transition: 0.2s ease;

    cursor: pointer;
}

/* BOUTON CV */

.cv {
    color: white;

    background:
        linear-gradient(
            145deg,
            #686868,
            #3d3d3d
        );

    border: 3px solid #282828;

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.35),
        inset 0 -4px 8px rgba(0,0,0,0.25),
        0 7px 12px rgba(0,0,0,0.25);
}

/* BOUTON CONTACT */

.contact {
    color: #303030;

    background: rgba(255,255,255,0.92);

    border: 5px solid #5c5c5c;

    box-shadow:
        0 7px 12px rgba(0,0,0,0.15);
}

/* ICÔNES */

.icon {
    font-size: 34px;
}

/* PETITS TAGS */

.tags {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;

    gap: 16px;

    margin-top: 60px;
}

.tag {
    padding: 12px 20px;

    border-radius: 12px;

    background: linear-gradient(
        145deg,
        #eef0f2,
        #dfe2e5
    );

    color: #303030;

    font-size: 20px;

    box-shadow:
        0 4px 8px rgba(0,0,0,0.12);
}

/* EFFET AU SURVOL */

.btn:hover {
    transform: translateY(-2px);
}

.btn:active {
    transform: scale(0.98);
}

/* VERSION TÉLÉPHONE */

@media (max-width: 600px) {

    body {
        padding: 25px 20px;
        align-items: flex-start;
        padding-top: 120px;
    }

    .card {
        max-width: 100%;

        padding: 70px 55px 55px;

        border-radius: 28px;
    }

    .logo {
        width: 115px;
        height: 115px;

        font-size: 62px;

        margin-bottom: 60px;
    }

    h1 {
        font-size: 52px;
    }

    .subtitle {
        font-size: 27px;
        margin-bottom: 65px;
    }

    .btn {
        min-height: 95px;
        font-size: 27px;
    }

    .tag {
        font-size: 18px;
        padding: 11px 16px;
    }
}

</style>
</head>

<body>

<div class="card">

    <div class="logo">
        A
    </div>

    <h1>AZIZ</h1>

    <div class="subtitle">
        Agent de sécurité
    </div>

    <div class="buttons">

        <a
            href="CV.pdf"
            target="_blank"
            class="btn cv"
        >
            <span>Voir mon CV</span>
            <span class="icon">▤</span>
        </a>

        <a
            href="tel:0612345678"
            class="btn contact"
        >
            <span>Me contacter</span>
            <span class="icon">✉</span>
        </a>

    </div>

    <div class="tags">

        <div class="tag">Sérieux</div>
        <div class="tag">Ponctuel</div>
        <div class="tag">Motivé</div>
        <div class="tag">Discret</div>

    </div>

</div>

</body>
</html>

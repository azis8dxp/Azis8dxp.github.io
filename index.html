<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZIZ - Agent de sécurité</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
min-height: 100vh;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
background: #1d2126;
}

/* CARTE PRINCIPALE EN MARBRE */
.card {
width: 100%;
max-width: 420px;
padding: 45px 25px;
border-radius: 30px;
background-image: url('marbre.jpg');
background-size: cover;
background-position: center;
box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
text-align: center;
}

/* AVATAR A */
.avatar {
width: 90px;
height: 90px;
margin: 0 auto 15px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 40px;
font-weight: 300;
color: #ffffff;
background: radial-gradient(circle at 35% 35%, #7a8288 0%, #31363c 100%);
box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6),
inset 0 -4px 8px rgba(0, 0, 0, 0.7),
0 6px 12px rgba(0, 0, 0, 0.2);
border: 2px solid #5d646b;
}

/* TEXTES */
h1 {
font-size: 36px;
font-weight: 800;
letter-spacing: 2px;
color: #1a1a1a;
margin-bottom: 2px;
}

.subtitle {
font-size: 18px;
color: #555555;
font-weight: 500;
margin-bottom: 30px;
}

/* BOUTONS */
.buttons {
display: flex;
flex-direction: column;
gap: 14px;
margin-bottom: 30px;
}

.btn {
width: 100%;
padding: 16px;
border-radius: 14px;
text-decoration: none;
font-size: 18px;
font-weight: 700;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
}

.btn-cv {
color: #ffffff;
background: linear-gradient(180deg, #42474c 0%, #222528 100%);
border: 1px solid #111;
box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
}

.btn-contact {
color: #1a1a1a;
background: #ffffff;
border: 2px solid #333333;
box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

/* BADGES */
.tags {
display: flex;
justify-content: center;
flex-wrap: wrap;
gap: 8px;
}

.tag {
padding: 6px 14px;
border-radius: 8px;
background: rgba(255, 255, 255, 0.6);
border: 1px solid rgba(0, 0, 0, 0.08);
font-size: 14px;
font-weight: 600;
color: #333333;
}
</style>
</head>
<body>

<div class="card">
<div class="avatar">A</div>

<h1>AZIZ</h1>
<p class="subtitle">Agent de sécurité</p>

<div class="buttons">
<a href="#" class="btn btn-cv">Voir mon CV 📄</a>
<a href="#" class="btn btn-contact">Me contacter ✉️</a>
</div>

<div class="tags">
<span class="tag">Sérieux</span>
<span class="tag">Ponctuel</span>
<span class="tag">Motivé</span>
<span class="tag">Discret</span>
</div>
</div>

</body>
</html>
